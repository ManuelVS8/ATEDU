<!DOCTYPE html>
<html lang="es" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="google" content="notranslate">
<title>ATEDU · Empatía — Una carta para el abuelo</title>
<link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/ManuelVS8/Audios-juegos-SCIENCE/refs/heads/main/icono.ico">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root{
    --blue:#001DFF;
    --blue-dark:#04032B;
    --blue-700:#1a3a5f;
    --blue-600:#254fba;
    --orange:#f59e42;
    --orange-700:#e67e22;
    --bg-grad-1:#1a3a5f;
    --bg-grad-2:#0d2340;
    --white:#ffffff;
    --green:#2ecc71;
    --green-dark:#1e9e57;
    --red:#e74c3c;
    --panel:#E8EAFF;
    --fs-scale:1;
  }
  body{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
    min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
    padding:20px 12px; color:#333;
  }
  body.lang-ar{ font-family:'Segoe UI', Tahoma, 'Geeza Pro', Arial, sans-serif; }

  .game-container{
    background:var(--white); border-radius:16px; box-shadow:0 12px 24px rgba(0,0,0,.12);
    padding:1.2rem; max-width:980px; width:100%; min-height:640px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; margin-bottom:2rem;
  }

  /* ===== Cabecera ===== */
  header{ text-align:center; margin-bottom:.6rem; margin-top:3.2rem; }
  h1{ color:var(--blue-dark); font-size:calc(clamp(1.6rem,4.5vw,2.6rem) * var(--fs-scale)); font-weight:900; letter-spacing:.5px; line-height:1.15; }
  .subtitle{ color:var(--blue-700); font-size:calc(clamp(.95rem,3vw,1.15rem) * var(--fs-scale)); margin-top:.3rem; font-weight:600; }
  .highlight-keyword{ color:var(--orange); font-weight:800; }
  .keyword{ color:var(--blue-600); font-weight:900; }
  .instructions{ color:var(--blue-700); text-align:center; font-size:calc(clamp(.9rem,2.3vw,1.02rem) * var(--fs-scale)); margin:0 auto .9rem; max-width:720px; }

  /* ===== Botones ===== */
  .btn{ color:#fff; border:none; padding:.75rem 1.2rem; border-radius:10px; cursor:pointer; font-weight:800; font-family:inherit;
    transition:transform .08s ease, box-shadow .2s ease, background-color .25s ease; min-width:140px; min-height:48px;
    display:inline-flex; align-items:center; justify-content:center; gap:.4rem; font-size:calc(1rem * var(--fs-scale)); }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.12); }
  .btn:active{ transform:translateY(0) scale(.97); }
  .btn-primary{ background:var(--orange); }
  .btn-primary:hover{ background:var(--orange-700); }
  .btn-blue{ background:var(--blue-600); }
  .btn-blue:hover{ filter:brightness(.9); }
  .btn-ghost{ background:#e6f2ff; color:var(--blue-700); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-row{ display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; margin-top:1.2rem; }

  /* ===== Pantallas ===== */
  .screen{ display:flex; flex-direction:column; flex:1; }
  .screen.anim{ animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
  @keyframes shakeAnim{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-5px);} 40%{transform:translateX(5px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
  .content{ width:100%; max-width:760px; margin:0 auto; display:flex; flex-direction:column; }

  /* ===== Controles superiores ===== */
  .top-controls{ position:absolute; top:.8rem; right:1rem; display:flex; align-items:center; gap:8px; z-index:20; }
  .lang-pill, .font-pill{ display:flex; align-items:center; background:#fff; border-radius:999px; padding:3px; gap:3px;
    box-shadow:0 2px 8px rgba(0,0,0,0.12); border:1px solid #e0e0e0; }
  .lang-pill button{ width:34px; height:34px; border-radius:50%; border:none; font-size:1.15rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; background:transparent; transition:background .2s, opacity .2s, transform .15s; }
  .lang-pill button.active-lang{ background:var(--blue-600); transform:scale(1.08); }
  .lang-pill button:not(.active-lang){ opacity:.5; }
  .lang-pill button:hover:not(.active-lang){ opacity:.8; transform:scale(1.05); }
  .font-pill button{ width:34px; height:34px; border-radius:50%; border:none; background:transparent; color:var(--blue-600);
    font-weight:900; font-size:.85rem; cursor:pointer; font-family:inherit; transition:background .2s, color .2s; }
  .font-pill button:hover{ background:var(--panel); }
  .font-pill button:active{ background:var(--blue-600); color:#fff; }
  .mute-btn{ background:linear-gradient(135deg, var(--orange), var(--orange-700)); color:#fff; border:2px solid #fff;
    width:38px; height:38px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:transform .2s, box-shadow .2s; box-shadow:0 2px 8px rgba(0,0,0,0.12); }
  .mute-btn:hover{ transform:scale(1.1); box-shadow:0 4px 12px rgba(245,158,66,.4); }
  .mute-btn.muted{ background:linear-gradient(135deg,#999,#777); }
  .mute-btn svg{ width:20px; height:20px; pointer-events:none; }

  /* ===== Barra de progreso ===== */
  .game-info{ display:flex; gap:.7rem; align-items:center; justify-content:space-between; margin:.3rem auto 1rem; width:100%; max-width:760px; }
  .level-indicator{ font-weight:900; color:var(--orange-700); font-size:clamp(.9rem,2.3vw,1.1rem); white-space:nowrap; }
  .counter{ font-weight:900; color:var(--blue-700); font-size:clamp(.9rem,2.3vw,1.1rem); white-space:nowrap; }
  .progress-bar{ flex:1; height:10px; background:#e6f2ff; border-radius:999px; overflow:hidden; }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--orange) 0%, var(--orange-700) 100%); transition:width .3s ease; }

  /* ===== Inicio ===== */
  .start-content{ display:flex; flex-direction:column; justify-content:center; align-items:center; flex:1; gap:1rem; padding:1rem; }
  .advice-box{ background:var(--panel); border-left:4px solid var(--blue-700); padding:1rem 1.2rem; border-radius:12px;
    color:var(--blue-700); max-width:760px; width:100%; text-align:center; font-size:calc(clamp(1rem,3vw,1.15rem) * var(--fs-scale)); line-height:1.55; }
  .advice-box strong{ display:block; margin-top:.5rem; font-size:1.15em; }
  .start-icon{ font-size:3.2rem; line-height:1; }
  .start-image{ max-width:300px; width:100%; margin:0 auto; }

  /* ===== Lectura ===== */
  .story-block{ background:#E8EAFF; border:2px solid var(--blue-600); border-radius:16px; padding:1.4rem 1.6rem; }
  .story-block p{ color:var(--blue-dark); line-height:1.75; font-size:calc(clamp(.95rem,2.4vw,1.08rem) * var(--fs-scale)); margin-bottom:.9rem; }
  .story-block p:last-child{ margin-bottom:0; }
  .story-block .keyword{ color:var(--blue-600); }

  /* ===== Menú de actividades ===== */
  .level-list{ display:flex; flex-direction:column; gap:.7rem; }
  .level-row{ display:flex; align-items:center; gap:.9rem; padding:.85rem 1rem; border-radius:12px; border:2px solid #d3e2ff;
    background:#fff; cursor:pointer; transition:transform .2s ease, box-shadow .2s ease; }
  .level-row:not(.locked):hover{ transform:translateY(-3px); box-shadow:0 8px 16px rgba(0,0,0,.08); }
  .level-icon{ width:46px; height:46px; border-radius:50%; background:var(--panel); display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0; }
  .level-info{ flex:1; }
  .level-name{ font-weight:800; color:var(--blue-dark); font-size:calc(clamp(1rem,2.5vw,1.12rem) * var(--fs-scale)); }
  .level-state{ font-weight:700; font-size:calc(.85rem * var(--fs-scale)); margin-top:.15rem; }
  .level-go{ font-size:1.3rem; font-weight:900; color:var(--orange); flex-shrink:0; }
  .level-row.current{ border-color:var(--orange); background:#FFF1E0; }
  .level-row.current .level-icon{ background:var(--orange); }
  .level-row.current .level-state{ color:var(--orange-700); }
  .level-row.done{ border-color:var(--green); background:#eafaf1; }
  .level-row.done .level-icon{ background:#c8f1d9; }
  .level-row.done .level-state{ color:var(--green-dark); }
  .level-row.done .level-go{ color:var(--green-dark); }
  .level-row.locked{ background:#f3f4f7; border-color:#e1e4ea; opacity:.6; cursor:not-allowed; }
  .level-row.locked .level-state{ color:#8892a0; }
  .footnote{ font-size:calc(.8rem * var(--fs-scale)); color:#8892a0; text-align:center; margin-top:.9rem; }

  /* ===== Preguntas (Test) ===== */
  .question-text{ font-size:calc(clamp(1.05rem,2.5vw,1.35rem) * var(--fs-scale)); font-weight:600; color:var(--blue-dark); margin-bottom:1.2rem;
    text-align:center; background:var(--panel); padding:1.1rem 1.2rem; border-radius:10px; border-left:5px solid var(--blue-600); line-height:1.45; }
  .options-grid{ display:grid; gap:10px; width:100%; }
  .option-btn{ background:#fff; border:2px solid var(--blue-600); color:var(--blue-600); padding:1rem 15px; border-radius:10px;
    font-size:calc(clamp(.95rem,2vw,1.08rem) * var(--fs-scale)); cursor:pointer; transition:all .2s; text-align:left; font-weight:600; font-family:inherit; line-height:1.35; }
  body.lang-ar .option-btn{ text-align:right; }
  .option-btn:hover:not(:disabled){ background:#f8f9fa; transform:scale(1.02); }
  .option-btn:disabled{ cursor:default; }
  .option-btn.correct{ background:var(--green); color:#fff; border-color:var(--green); }
  .option-btn.wrong{ background:var(--red); color:#fff; border-color:var(--red); animation:shakeAnim .4s ease-in-out; }
  .feedback-msg{ text-align:center; font-weight:800; padding:.7rem; border-radius:10px; margin-top:1rem; font-size:calc(1.05rem * var(--fs-scale)); }
  .feedback-msg.ok{ background:#eafaf1; color:var(--green-dark); }
  .feedback-msg.bad{ background:#fdeceb; color:var(--red); }

  /* ===== Verdadero / Falso ===== */
  .tf-list{ display:flex; flex-direction:column; gap:.6rem; }
  .tf-row{ display:flex; align-items:center; gap:.8rem; padding:.8rem 1rem; border-radius:12px; border:2px solid #d3e2ff; background:#fff; transition:border-color .2s, background .2s; }
  .tf-text{ flex:1; font-weight:700; color:var(--blue-dark); font-size:calc(clamp(.9rem,2vw,1.05rem) * var(--fs-scale)); line-height:1.4; }
  .tf-btns{ display:flex; gap:.4rem; flex-shrink:0; }
  .tf-btns button{ width:44px; height:44px; border-radius:10px; border:2px solid var(--blue-600); background:#fff; color:var(--blue-600);
    font-weight:900; font-size:calc(1rem * var(--fs-scale)); cursor:pointer; font-family:inherit; transition:all .15s; }
  .tf-btns button:hover:not(:disabled){ transform:scale(1.08); }
  .tf-btns button.sel{ background:var(--blue-600); color:#fff; }
  .tf-btns button:disabled{ cursor:default; }
  .tf-row.ok{ border-color:var(--green); background:#eafaf1; }
  .tf-row.ok .tf-text{ color:var(--green-dark); }
  .tf-row.ok .tf-btns button.sel{ background:var(--green); border-color:var(--green); }
  .tf-row.bad{ border-color:var(--red); background:#fdeceb; animation:shakeAnim .4s ease; }
  .tf-row.bad .tf-text{ color:var(--red); }
  .tf-row.bad .tf-btns button.sel{ background:var(--red); border-color:var(--red); }
  .score-box{ text-align:center; font-weight:900; color:var(--blue-700); background:var(--panel); border-radius:12px; padding:.8rem; margin-top:1rem; font-size:calc(1.15rem * var(--fs-scale)); }

  /* ===== Emparejar ===== */
  .match-cols{ display:flex; gap:10px; width:100%; }
  .match-col{ flex:1; display:flex; flex-direction:column; gap:8px; }
  .match-col.left{ flex:1.6; }
  .match-col.right .memory-card{ flex:1; font-size:calc(clamp(1rem,2.8vw,1.25rem) * var(--fs-scale)); }
  .memory-card{ background-color:var(--blue-600); color:#fff; border:3px solid transparent; border-radius:10px; padding:12px 10px; cursor:pointer;
    transition:background-color .2s ease, box-shadow .2s ease, transform .15s ease; text-align:center; min-height:64px;
    display:flex; align-items:center; justify-content:center; font-size:calc(clamp(.85rem,2.3vw,1rem) * var(--fs-scale)); font-weight:700;
    user-select:none; word-break:break-word; box-shadow:0 2px 6px rgba(0,0,0,.08); line-height:1.3; }
  .memory-card:hover:not(.sel):not(.done):not(.err){ transform:scale(1.02); box-shadow:0 4px 10px rgba(0,0,0,.18); }
  .memory-card.sel{ background-color:var(--orange); animation:cardPulse 1s ease-in-out infinite; }
  @keyframes cardPulse{ 0%,100%{transform:scale(1.02);} 50%{transform:scale(1.05);} }
  .memory-card.done{ background-color:var(--green); cursor:default; animation:none; transform:none; box-shadow:0 3px 10px rgba(46,204,113,.35); }
  .memory-card.err{ background-color:var(--red) !important; animation:shakeAnim .4s ease-in-out; }

  /* ===== Ordenar ===== */
  .phase-card{ border:2px solid #b7e4c7; border-radius:12px; padding:.8rem 1rem; margin-bottom:.8rem; display:flex; align-items:center; gap:.8rem;
    transition:all .3s ease; cursor:pointer; background:#f8fff9; }
  .phase-card:hover{ transform:translateY(-3px); box-shadow:0 8px 16px rgba(0,0,0,.08); }
  .phase-card.selected{ border-color:var(--orange); background:#FFF1E0; box-shadow:0 0 0 3px rgba(245,158,66,.25); }
  .phase-num{ min-width:32px; height:32px; border-radius:50%; background:var(--blue-600); color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:calc(.95rem * var(--fs-scale)); flex-shrink:0; }
  .phase-text{ flex:1; font-weight:700; font-size:calc(clamp(.9rem,2vw,1.08rem) * var(--fs-scale)); color:var(--blue-dark); text-align:left; line-height:1.4; }
  body.lang-ar .phase-text{ text-align:right; }
  .phase-controls{ display:flex; gap:.4rem; flex-shrink:0; }
  .phase-btn{ width:40px; height:40px; border-radius:8px; background:var(--orange); border:none; color:#fff; font-weight:800; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .2s ease; }
  .phase-btn:hover:not(:disabled){ background:var(--orange-700); transform:scale(1.1); }
  .phase-btn:disabled{ background:#ccc; cursor:not-allowed; opacity:.5; }
  .phase-card.ok, .phase-card.bad{ cursor:default; }
  .phase-card.ok{ border-color:var(--green); background:#eafaf1; }
  .phase-card.ok .phase-text{ color:var(--green-dark); font-weight:900; }
  .phase-card.ok .phase-num{ background:var(--green); }
  .phase-card.bad{ border-color:var(--red); background:#fdeceb; animation:shakeAnim .4s ease; }
  .phase-card.bad .phase-text{ color:var(--red); font-weight:900; }
  .phase-card.bad .phase-num{ background:var(--red); }

  /* ===== Debate ===== */
  .debate-icon{ font-size:4rem; text-align:center; margin:.5rem 0 1rem; animation:bounce 2s ease infinite; }
  .debate-box{ font-size:calc(clamp(1.1rem,3vw,1.4rem) * var(--fs-scale)); font-weight:700; }

  /* ===== Compromiso escrito ===== */
  textarea{ width:100%; min-height:150px; border-radius:12px; border:2px solid #d3e2ff; padding:1rem; font-size:calc(1.05rem * var(--fs-scale));
    font-family:inherit; resize:vertical; line-height:1.55; color:var(--blue-dark); margin-top:1rem; transition:border-color .2s, box-shadow .2s; }
  textarea:focus{ outline:none; border-color:var(--blue-600); box-shadow:0 0 0 3px rgba(37,79,186,.15); }
  textarea.rtl{ direction:rtl; text-align:right; }
  .keyboard-toggle{ margin-top:.8rem; align-self:center; }
  .keyboard{ margin-top:.8rem; background:var(--panel); border-radius:12px; padding:10px; }
  .kb-row{ display:flex; gap:4px; margin-bottom:4px; justify-content:center; flex-wrap:nowrap; }
  .kb-key{ background:#fff; border:1px solid #d3e2ff; border-radius:7px; padding:8px 0; width:30px; text-align:center; font-size:15px; cursor:pointer;
    flex-shrink:1; color:var(--blue-dark); font-family:inherit; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .kb-key:active{ background:var(--blue-600); color:#fff; }
  .kb-key.wide{ width:64px; font-weight:800; background:var(--blue-600); color:#fff; border-color:var(--blue-600); }
  .kb-key.space{ width:140px; }

  /* ===== Login / guardado en la nube ===== */
  .login-field{ width:100%; max-width:420px; margin:0 auto .9rem; text-align:left; }
  .login-field label{ display:block; font-weight:700; color:var(--blue-700); margin-bottom:.3rem; font-size:calc(.95rem * var(--fs-scale)); }
  .login-field input{ width:100%; padding:.8rem 1rem; border-radius:10px; border:2px solid #d3e2ff; font-size:calc(1.05rem * var(--fs-scale));
    font-family:inherit; color:var(--blue-dark); }
  .login-field input:focus{ outline:none; border-color:var(--blue-600); box-shadow:0 0 0 3px rgba(37,79,186,.15); }
  body.lang-ar .login-field{ text-align:right; }
  .login-note{ font-size:calc(.85rem * var(--fs-scale)); color:#8892a0; text-align:center; max-width:420px; margin:0 auto; }
  .student-badge{ position:absolute; top:.8rem; left:1rem; background:#fff; border:1px solid #e0e0e0; border-radius:999px;
    padding:.4rem .9rem; font-weight:800; color:var(--blue-700); font-size:calc(.85rem * var(--fs-scale)); cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.12); z-index:20; }
  .student-badge:hover{ background:var(--panel); }

  /* ===== Final ===== */
  .results{ display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:.9rem; padding:1rem; text-align:center; }
  .trophy{ font-size:clamp(4rem,12vw,5.5rem); animation:bounce 1s ease infinite; line-height:1; }
  @keyframes bounce{ 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-15px) scale(1.1);} }
  .message{ font-size:calc(clamp(1.1rem,3.5vw,1.6rem) * var(--fs-scale)); font-weight:800; color:var(--blue-700); }
  .results-table-box{ background:var(--panel); border-radius:12px; padding:1rem; width:100%; max-width:520px; }
  .results-table-title{ color:var(--blue-700); font-weight:800; font-size:1.15rem; margin-bottom:.7rem; }
  .results-table{ width:100%; border-collapse:collapse; font-size:calc(.95rem * var(--fs-scale)); }
  .results-table th{ background:var(--blue-600); color:#fff; padding:.5rem .7rem; text-align:left; }
  .results-table td{ padding:.5rem .7rem; border-bottom:1px solid #d3d8f0; text-align:left; color:var(--blue-dark); font-weight:600; }
  .results-table tr:last-child td{ border-bottom:none; }
  .results-table tr:nth-child(even) td{ background:rgba(255,255,255,.5); }
  body.lang-ar .results-table th, body.lang-ar .results-table td{ text-align:right; }
  .score-perfect{ color:var(--green-dark) !important; font-weight:900 !important; }
  .score-partial{ color:var(--orange-700) !important; font-weight:900 !important; }
  .final-note{ color:var(--blue-700); font-size:calc(1rem * var(--fs-scale)); max-width:520px; }
  .credit{ font-size:.9rem; color:#999; margin-top:.6rem; }
  .school-logo{ display:block; width:160px; max-width:40%; height:auto; border-radius:8px; object-fit:contain; }

  /* ===== Modal ===== */
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:999; padding:20px; }
  .modal-content{ background:#fff; padding:2rem 1.6rem 1.6rem; border-radius:15px; width:90%; max-width:400px; text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3); animation:fadeIn .25s ease; }
  .modal-content p{ color:var(--blue-dark); font-weight:700; font-size:calc(1.1rem * var(--fs-scale)); line-height:1.45; margin-bottom:1.3rem; }
  .modal-content .btn-row{ margin-top:0; }
  .modal-content .btn{ min-width:120px; }

  .confetti{ position:fixed; width:10px; height:10px; border-radius:50%; animation:confetti-fall 3s linear forwards; z-index:1000; pointer-events:none; }
  @keyframes confetti-fall{ 0%{transform:translate(0,-20px) rotate(0);opacity:1;} 100%{transform:translate(var(--tx),var(--ty)) rotate(360deg);opacity:0;} }

  @media (max-width:520px){
    .game-container{ padding:1rem .8rem; }
    .top-controls{ right:.6rem; gap:5px; }
    .lang-pill button, .font-pill button{ width:30px; height:30px; font-size:1rem; }
    .font-pill button{ font-size:.78rem; }
    .mute-btn{ width:34px; height:34px; }
    header{ margin-top:3rem; }
    .btn{ min-width:110px; padding:.6rem .9rem; }
    .phase-card{ padding:.7rem; gap:.6rem; }
    .phase-btn{ width:34px; height:34px; }
    .tf-row{ padding:.7rem; }
    .tf-btns button{ width:40px; height:40px; }
    .memory-card{ padding:9px 7px; min-height:58px; }
    .story-block{ padding:1.1rem 1.1rem; }
    .kb-key{ width:25px; font-size:13px; }
    .kb-key.wide{ width:54px; }
    .kb-key.space{ width:110px; }
  }
</style>
</head>
<body>

const SOUND_BASE = "https://raw.githubusercontent.com/ManuelVS8/Efectos_audio/main/";
const SOUND_FILES = {
  tap:"Tap.mp3",
  correct:"Correcto.mp3",
  error:"Error.mp3",
  completed:"Completado.mp3",
  victory:"Victoria%202.mp3"
};
const soundCache = {};
function getSound(name){
  if(!soundCache[name]){
    const a = new Audio(SOUND_BASE + SOUND_FILES[name]);
    a.preload = "auto";
    soundCache[name] = a;
  }
  return soundCache[name];
}
function playSound(name){
  if(state.isMuted) return;
  try{
    const base = getSound(name);
    const clone = base.cloneNode(true);
    clone.play().catch(()=>{});
  }catch(e){ /* audio not critical, ignore */ }
}
function vibrateWrong(){
  try{ if(navigator.vibrate) navigator.vibrate(120); }catch(e){}

let cloudBusy = false;

function cloudConfigured(){
  return CLOUD_API_URL && CLOUD_API_URL.indexOf("PON_AQUI")!==0;
}
async function cloudRequest(action, extra){
  if(!cloudConfigured()) return {ok:false, error:"no_configurado"};
  try{
    const res = await fetch(CLOUD_API_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(Object.assign({action:action, game:GAME_ID}, extra))
    });
    return await res.json();
  }catch(e){
    return {ok:false, error:"red"};
  }
}

}
function saveLocalFor(name, data){

}

function shuffledIndexes(n){
  let arr = Array.from({length:n}, (_,i)=>i);
  let isIdentity = true;
  let tries = 0;
  do{
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    isIdentity = arr.every((v,i)=>v===i);
    tries++;
  } while(isIdentity && tries<10);
  return arr;
}

/* ---------------- RENDER ROOT ---------------- */
function render(){
  const t = tr();
  const app = document.getElementById("app");
  let inner = "";

  if(state.screen==="intro") inner = screenIntro(t);
  else if(state.screen==="nameScreen") inner = screenNameScreen(t);
  else if(state.screen==="story") inner = screenStory(t);
  else if(state.screen==="menu") inner = screenMenu(t);
  else if(state.screen==="mcq") inner = screenMcq(t);
  else if(state.screen==="tf") inner = screenTf(t);
  else if(state.screen==="match") inner = screenMatch(t);
  else if(state.screen==="order") inner = screenOrder(t);
  else if(state.screen==="debate") inner = screenDebate(t);
  else if(state.screen==="write") inner = screenWrite(t);
  else if(state.screen==="final") inner = screenFinal(t);

  const changed = state.screen !== lastRenderedScreen;
  lastRenderedScreen = state.screen;

  let html = controlsHtml() + studentBadgeHtml() + `<section class="screen${changed?' anim':''}">${inner}</section>`;

  if(state.modal){
    html += `<div class="modal-overlay"><div class="modal-content">
      <p ${dirAttr()}>${esc(state.modal.msg)}</p>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="modalCancel()">${esc(state.modal.noLabel || t.cancel)}</button>
        <button class="btn btn-primary" onclick="modalConfirm()">${esc(state.modal.yesLabel || t.yes)}</button>
      </div>
    </div></div>`;
  }

  app.innerHTML = html;
  if(changed) window.scrollTo(0,0);

  if(state.screen==="write"){
    const ta = document.getElementById("writeArea");
    if(ta){
      ta.value = state.writeText;
      ta.oninput = function(){ state.writeText = ta.value; scheduleSave(); };
      ta.classList.toggle("rtl", state.lang==="ar");
    }
  }
  saveProgress();
}

function highlightNames(text, names){
  let out = esc(text);
  const pattern = names.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  const re = new RegExp(`(^|[\\s،,.—!¡؟?¿:;«»"])(${pattern})(?=[\\s،,.—!¡؟?¿:;«»"]|$)`, 'g');
  return out.replace(re, '$1<span class="keyword">$2</span>');
}

function enterLevel(key){
  if(state.levelStatus[key]==="locked") return;
  playSound('tap');
  if(key==="mcq"){ state.mcqIndex=0; state.mcqAnswered=false; state.mcqSelected=null; state.scores.mcq=0; }
  if(key==="tf"){ state.tfAnswers={}; state.tfChecked=false; }
  if(key==="match"){ state.matchSelLeft=null; state.matchDone={}; state.matchErr=null; }
  if(key==="order"){ state.orderChecked=false; state.orderDisplay=shuffledIndexes(tr().order.length); state.orderSelected=null; }
  if(key==="write"){ /* keep text if revisiting */ }
  state.screen = key;
  render();
}

function unlockNext(fromKey){
  const idx = LEVEL_ORDER.indexOf(fromKey);
  state.levelStatus[fromKey]="done";
  if(idx>=0 && idx+1<LEVEL_ORDER.length){
    const nextKey = LEVEL_ORDER[idx+1];
    if(state.levelStatus[nextKey]==="locked") state.levelStatus[nextKey]="unlocked";
    playSound('completed');
  } else {
    playSound('victory');
    if(state.studentName){
      try{ localStorage.removeItem(localKeyFor(state.studentName)); }catch(e){}
    }
    state.screen="final";
    render();
    if(isPerfect()) createConfetti();
    return;
  }
  state.screen="menu";
  render();
}

/* ---- MCQ ---- */
function screenMcq(t){
  const q = t.mcq[state.mcqIndex];
  const opts = q.opts.map((o,i)=>{
    let cls="option-btn";
    if(state.mcqAnswered){
      if(i===q.correct) cls+=" correct";
      else if(i===state.mcqSelected) cls+=" wrong";
    }
    return `<button class="${cls}" ${dirAttr()} ${state.mcqAnswered?"disabled":""} onclick="mcqAnswer(${i})">${esc(o)}</button>`;
  }).join("");
  const fb = state.mcqAnswered ?
    (state.mcqSelected===q.correct
      ? `<div class="feedback-msg ok">${esc(t.correct)}</div>`
      : `<div class="feedback-msg bad">${esc(t.incorrect)}</div>`) : "";
  const isLast = state.mcqIndex===t.mcq.length-1;
  const nextBtn = state.mcqAnswered ?
    `<div class="btn-row"><button class="btn btn-primary" onclick="${isLast?'mcqFinish()':'mcqNext()'}">${esc(isLast?t.continueBtn:t.next)}</button></div>` : "";
  return `<header>
      <h1 ${dirAttr()}>📝 ${esc(t.levels.mcq)}</h1>
      <div class="subtitle" ${dirAttr()}>${esc(t.gameSubtitle)}</div>
    </header>
    ${progressHtml(`${t.levels.mcq} ${state.mcqIndex+1}/${t.mcq.length}`)}
    <div class="content">
      <div class="question-text" ${dirAttr()}>${esc(q.q)}</div>
      <div class="options-grid">${opts}</div>
      ${fb}
      ${nextBtn}
    </div>`;
}
function mcqAnswer(i){
  if(state.mcqAnswered) return;
  state.mcqSelected=i; state.mcqAnswered=true;
  const t=tr();
  const isCorrect = i===t.mcq[state.mcqIndex].correct;
  if(isCorrect) state.scores.mcq++;
  playSound(isCorrect ? 'correct' : 'error');
  if(!isCorrect) vibrateWrong();
  render();
}
function mcqNext(){ playSound('tap'); state.mcqIndex++; state.mcqAnswered=false; state.mcqSelected=null; render(); }
function mcqFinish(){ unlockNext("mcq"); }

/* ---- TF ---- */
function screenTf(t){
  const rows = t.tf.map((item,i)=>{
    const sel = state.tfAnswers[i];
    let rowCls="tf-row";
    if(state.tfChecked){
      rowCls += (sel===item.a) ? " ok" : " bad";
    }
    return `<div class="${rowCls}">
      <div class="tf-text" ${dirAttr()}>${esc(item.t)}</div>
      <div class="tf-btns">
        <button type="button" class="${sel===true?'sel':''}" title="${esc(t.trueLabel)}" ${state.tfChecked?'disabled':''} onclick="tfSet(${i},true)">${esc(t.v)}</button>
        <button type="button" class="${sel===false?'sel':''}" title="${esc(t.falseLabel)}" ${state.tfChecked?'disabled':''} onclick="tfSet(${i},false)">${esc(t.f)}</button>
      </div>
    </div>`;
  }).join("");
  const allAnswered = t.tf.every((_,i)=>state.tfAnswers[i]!==undefined);
  const checkBtn = !state.tfChecked ?
    `<div class="btn-row"><button class="btn btn-primary" ${allAnswered?"":"disabled"} onclick="tfCheck()">${esc(t.check)}</button></div>` :
    `<div class="score-box">${esc(t.scoreLabel)}: ${state.scores.tf}/${t.tf.length}</div>
     <div class="btn-row"><button class="btn btn-primary" onclick="unlockNext('tf')">${esc(t.continueBtn)}</button></div>`;
  return `<header>
      <h1 ${dirAttr()}>✅ ${esc(t.levels.tf)}</h1>
      <div class="subtitle" ${dirAttr()}>${esc(t.gameSubtitle)}</div>
    </header>

    <div class="content">
      <div class="tf-list">${rows}</div>
      ${checkBtn}
    </div>`;
}
function tfSet(i,val){
  if(state.tfChecked) return;
  playSound('tap');
  state.tfAnswers[i]=val;
  render();
}
function tfCheck(){
  const t=tr();
  let score=0;
  t.tf.forEach((item,i)=>{ if(state.tfAnswers[i]===item.a) score++; });
  state.scores.tf = score;
  state.tfChecked = true;
  playSound(score===t.tf.length ? 'correct' : 'error');
  if(score!==t.tf.length) vibrateWrong();
  render();
}

/* ---- MATCH ---- */
function screenMatch(t){
  const leftHtml = t.matchLeft.map((item,i)=>{
    let cls="memory-card";
    if(state.matchDone[i]!==undefined) cls+=" done";
    else if(state.matchSelLeft===i) cls+=" sel";
    else if(state.matchErr && state.matchErr.left===i) cls+=" err";
    const done = state.matchDone[i]!==undefined;
    return `<div class="${cls}" ${dirAttr()} ${done?"":`onclick="matchLeftClick(${i})"`}>${esc(item.t)}</div>`;
  }).join("");

  const rightHtml = t.matchRight.map((name,ri)=>{
    let cls="memory-card";
    const usedCount = t.matchLeft.filter((it,li)=>state.matchDone[li]!==undefined && t.matchRight[state.matchDone[li]]===name).length;
    const totalForName = t.matchLeft.filter(it=>it.who===name).length;
    if(usedCount>=totalForName) cls+=" done";
    else if(state.matchErr && state.matchErr.right===ri) cls+=" err";
    return `<div class="${cls}" onclick="matchRightClick(${ri})">${esc(name)}</div>`;
  }).join("");

  const totalPairs = t.matchLeft.length;
  const donePairs = Object.keys(state.matchDone).length;
  const allDone = donePairs===totalPairs;

  return `<header>
      <h1 ${dirAttr()}>🔗 ${esc(t.levels.match)}</h1>
      <div class="subtitle" ${dirAttr()}>${state.lang==='es'?'Toca una frase y después el nombre que le corresponde.':'ضغط على الجملة، من بعد ضغط على الإسم لي كيوافقها.'}</div>
    </header>
    ${progressHtml(`${t.levels.match} ${donePairs}/${totalPairs}`)}
    <div class="content">
      <div class="match-cols">
        <div class="match-col left">${leftHtml}</div>
        <div class="match-col right">${rightHtml}</div>
      </div>
      ${allDone?`<div class="btn-row"><button class="btn btn-primary" onclick="unlockNext('match')">${esc(t.continueBtn)}</button></div>`:""}
    </div>`;
}
function matchLeftClick(i){
  if(state.matchDone[i]!==undefined) return;
  playSound('tap');
  state.matchSelLeft = i;
  render();
}
function matchRightClick(ri){
  if(state.matchSelLeft===null) return;
  const t=tr();
  const li = state.matchSelLeft;
  const leftItem = t.matchLeft[li];
  const rightName = t.matchRight[ri];
  if(leftItem.who===rightName){
    state.matchDone[li]=ri;
    state.matchSelLeft=null;
    state.matchErr=null;
    state.scores.match = Object.keys(state.matchDone).length;
    playSound('correct');
    render();
  } else {
    state.matchErr = {left:li, right:ri};
    state.matchSelLeft = null;
    playSound('error');
    vibrateWrong();
    render();
    setTimeout(()=>{ state.matchErr=null; render(); }, 450);
  }
}

/* ---- ORDER ---- */
function screenOrder(t){
  if(!state.orderDisplay || state.orderDisplay.length!==t.order.length){
    state.orderDisplay = shuffledIndexes(t.order.length);
  }
  const n = state.orderDisplay.length;
  const rows = state.orderDisplay.map((idx,pos)=>{
    const item = t.order[idx];
    let cls="phase-card";
    if(pos===state.orderSelected) cls += " selected";
    if(state.orderChecked){
      cls += (pos+1===item.pos) ? " ok" : " bad";
    }
    const upDisabled = pos===0 || state.orderChecked;
    const downDisabled = pos===n-1 || state.orderChecked;
    return `<div class="${cls}" onclick="selectOrderItem(${pos})">
      <div class="phase-num">${pos+1}</div>
      <div class="phase-text" ${dirAttr()}>${esc(item.t)}</div>
      <div class="phase-controls">
        <button type="button" class="phase-btn" ${upDisabled?"disabled":""} onclick="event.stopPropagation();moveOrderItem(${pos},-1)">▲</button>
        <button type="button" class="phase-btn" ${downDisabled?"disabled":""} onclick="event.stopPropagation();moveOrderItem(${pos},1)">▼</button>
      </div>
    </div>`;
  }).join("");
  let actionBtn="";
  if(!state.orderChecked){
    actionBtn = `<div class="btn-row"><button class="btn btn-ghost" onclick="orderReset()">${esc(t.retry)}</button>
      <button class="btn btn-primary" onclick="orderCheck()">${esc(t.check)}</button></div>`;
  } else {
    actionBtn = `<div class="score-box">${esc(t.scoreLabel)}: ${state.scores.order}/${t.order.length}</div>
      <div class="btn-row"><button class="btn btn-ghost" onclick="orderReset()">${esc(t.retry)}</button>
      <button class="btn btn-primary" onclick="unlockNext('order')">${esc(t.continueBtn)}</button></div>`;
  }
  return `<header>
      <h1 ${dirAttr()}>🔢 ${esc(t.levels.order)}</h1>
      <div class="subtitle" ${dirAttr()}>${state.lang==='es'?'Toca una frase para seleccionarla y usa las flechas ▲▼ para moverla.':'ضغط على جملة باش تختارها، وبعدها استعمل السهمين ▲▼ باش تحركها.'}</div>
    </header>
    ${progressHtml(t.levels.order)}
    <div class="content">
      ${rows}
      ${actionBtn}
    </div>`;
}
function selectOrderItem(pos){
  if(state.orderChecked) return;
  playSound('tap');
  state.orderSelected = (state.orderSelected===pos) ? null : pos;
  render();
}
function moveOrderItem(pos, dir){
  if(state.orderChecked) return;
  const newPos = pos+dir;
  if(newPos<0 || newPos>=state.orderDisplay.length) return;
  playSound('tap');
  const arr = state.orderDisplay;
  const tmp = arr[pos]; arr[pos]=arr[newPos]; arr[newPos]=tmp;
  state.orderSelected = newPos;
  render();
}
function orderReset(){
  playSound('tap');
  state.orderDisplay = shuffledIndexes(tr().order.length);
  state.orderChecked = false;
  state.orderSelected = null;
  render();
}
function orderCheck(){
  const t=tr();
  let score=0;
  state.orderDisplay.forEach((idx,pos)=>{ if(t.order[idx].pos===pos+1) score++; });
  state.scores.order = score;
  state.orderChecked = true;
  state.orderSelected = null;
  playSound(score===t.order.length ? 'correct' : 'error');
  if(score!==t.order.length) vibrateWrong();
  render();
}

/* ---- DEBATE ---- */
function screenDebate(t){
  return `<header>
      <h1 ${dirAttr()}>💬 ${esc(t.levels.debate)}</h1>
      <div class="subtitle" ${dirAttr()}>${esc(t.gameSubtitle)}</div>
    </header>
    ${progressHtml(t.levels.debate)}
    <div class="content" style="flex:1;justify-content:center;">
      <div class="debate-icon">🗣️</div>
      <div class="advice-box debate-box" ${dirAttr()}>${esc(t.debateQ)}</div>
      <div class="btn-row"><button class="btn btn-primary" onclick="unlockNext('debate')">${esc(t.continueBtn)}</button></div>
    </div>`;
}

/* ---- WRITE ---- */
const AR_KB_ROWS = [
  ["ض","ص","ث","ق","ف","غ","ع","ه","خ","ح","ج"],
  ["ش","س","ي","ب","ل","ا","ت","ن","م","ك","ط"],
  ["ئ","ء","ؤ","ر","لا","ى","ة","و","ز","ظ","ڭ"]
];
function screenWrite(t){
  const kbHtml = state.showKb ? `<div class="keyboard">
    ${AR_KB_ROWS.map(row=>`<div class="kb-row">${row.map(k=>`<button type="button" class="kb-key" onclick="kbInsert('${k}')">${k}</button>`).join("")}</div>`).join("")}
    <div class="kb-row">
      <button type="button" class="kb-key wide" onclick="kbBackspace()">⌫</button>
      <button type="button" class="kb-key space" onclick="kbInsert(' ')"></button>
      <button type="button" class="kb-key wide" onclick="kbInsert('\\n')">↵</button>
    </div>
  </div>` : "";
  return `<header>
      <h1 ${dirAttr()}>✍️ ${esc(t.writeTitle)}</h1>
      <div class="subtitle" ${dirAttr()}>${esc(t.levels.write)}</div>
    </header>
    ${progressHtml(t.levels.write)}
    <div class="content">
      <div class="advice-box" ${dirAttr()}>${esc(t.writePrompt)}</div>
      <textarea id="writeArea" placeholder="${esc(t.writePlaceholder)}"></textarea>
      <button type="button" class="btn btn-ghost keyboard-toggle" onclick="toggleKb()">${esc(state.showKb?t.hideArKeyboard:t.showArKeyboard)}</button>
      ${kbHtml}
      <div class="btn-row"><button class="btn btn-primary" onclick="confirmFinish()">${esc(t.finish)}</button></div>
    </div>`;
}
function toggleKb(){ playSound('tap'); state.showKb=!state.showKb; render(); }
function kbInsert(ch){
  const ta = document.getElementById("writeArea");
  if(!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const val = ta.value;
  const insert = ch==='\\n' ? "\n" : ch;
  ta.value = val.slice(0,start) + insert + val.slice(end);
  const newPos = start+insert.length;
  ta.selectionStart = ta.selectionEnd = newPos;
  ta.focus();
  state.writeText = ta.value;
  scheduleSave();
}
function kbBackspace(){
  const ta = document.getElementById("writeArea");
  if(!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const val = ta.value;
  if(start===end && start>0){
    ta.value = val.slice(0,start-1)+val.slice(end);
    ta.selectionStart = ta.selectionEnd = start-1;
  } else {
    ta.value = val.slice(0,start)+val.slice(end);
    ta.selectionStart = ta.selectionEnd = start;
  }
  ta.focus();
  state.writeText = ta.value;
  scheduleSave();
}
function confirmFinish(){
  const ta = document.getElementById("writeArea");
  if(ta) state.writeText = ta.value;
  const t=tr();
  playSound('tap');
  showModal(t.finishConfirm, ()=>unlockNext("write"));
}

/* ---- FINAL ---- */
function isPerfect(){
  const t = T.es;
  return state.scores.mcq===t.mcq.length && state.scores.tf===t.tf.length &&
         state.scores.match===t.matchLeft.length && state.scores.order===t.order.length;
}
function scoreCell(got,total){
  return `<td class="${got===total?'score-perfect':'score-partial'}">${got}/${total}</td>`;
}
function screenFinal(t){
  return `<header>
      <h1 ${dirAttr()}>${esc(t.gameTitle)}</h1>
      <div class="subtitle" ${dirAttr()}>${esc(t.gameSubtitle)}</div>
    </header>
    <div class="results">
      <div class="trophy">🏆</div>
      <h1 ${dirAttr()}>${esc(t.congrats)}</h1>
      <div class="message" ${dirAttr()}>${esc(t.congratsText)}</div>
      <div class="results-table-box" ${dirAttr()}>
        <div class="results-table-title">${esc(t.summaryTitle)}</div>
        <table class="results-table">
          <thead><tr><th>${esc(t.activityCol)}</th><th>${esc(t.scoreLabel)}</th></tr></thead>
          <tbody>
            <tr><td>📝 ${esc(t.levels.mcq)}</td>${scoreCell(state.scores.mcq,t.mcq.length)}</tr>
            <tr><td>✅ ${esc(t.levels.tf)}</td>${scoreCell(state.scores.tf,t.tf.length)}</tr>
            <tr><td>🔗 ${esc(t.levels.match)}</td>${scoreCell(state.scores.match,t.matchLeft.length)}</tr>
            <tr><td>🔢 ${esc(t.levels.order)}</td>${scoreCell(state.scores.order,t.order.length)}</tr>
          </tbody>
        </table>
      </div>
      <p class="final-note" ${dirAttr()}>${esc(t.finalNote)}</p>
      <button class="btn btn-primary" onclick="confirmReset()">${esc(t.playAgain)}</button>
      <div class="credit">${esc(t.credit)}</div>
      <img class="school-logo" src="${IMG_LOGO}" alt="Logo Siurot">
    </div>`;
}

/* ---------------- CONFETI ---------------- */
function createConfetti(){
  for(let i=0;i<100;i++){
    setTimeout(()=>{
      const c = document.createElement('div');
      c.className = 'confetti';
      const x = Math.random() * window.innerWidth;
      const tx = (Math.random() - 0.5) * 200;
      c.style.left = x + 'px'; c.style.top = '-10px';
      c.style.backgroundColor = ['#ff595e','#1982c4','#6a4c93','#ffca3a','#8ac926'][Math.floor(Math.random()*5)];
      c.style.setProperty('--tx', tx + 'px');
      c.style.setProperty('--ty', window.innerHeight + 20 + 'px');
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 3000);
    }, i*20);
  }
}

/* ---------------- AUTOSAVE ---------------- */
let saveTimer = null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveProgress, 400); }
function buildSnapshot(){
  return {
    lang: state.lang,
    fontScale: state.fontScale,
    screen: state.screen,
    levelStatus: state.levelStatus,
    scores: state.scores,
    mcqIndex: state.mcqIndex,
    tfAnswers: state.tfAnswers,
    tfChecked: state.tfChecked,
    matchDone: state.matchDone,
    orderDisplay: state.orderDisplay,
    orderChecked: state.orderChecked,
    writeText: state.writeText
  };
}
function saveProgress(){
  if(state.screen==="final" || state.screen==="intro" || state.screen==="nameScreen") return;
  if(state.studentName) saveLocalFor(state.studentName, buildSnapshot());
  if(cloudUser) scheduleCloudSave();
}
function restoreProgress(saved){
  state.lang = saved.lang || "es";
  state.fontScale = saved.fontScale || 1;
  state.screen = saved.screen || "menu";
  state.levelStatus = saved.levelStatus || state.levelStatus;
  state.scores = saved.scores || state.scores;
  state.mcqIndex = saved.mcqIndex || 0;
  state.mcqAnswered = false; state.mcqSelected = null;
  state.tfAnswers = saved.tfAnswers || {};
  state.tfChecked = !!saved.tfChecked;
  state.matchDone = saved.matchDone || {}; state.matchSelLeft = null; state.matchErr = null;
  state.orderDisplay = saved.orderDisplay || null;
  state.orderChecked = !!saved.orderChecked;
  state.orderSelected = null;
  state.writeText = saved.writeText || "";
  document.body.classList.toggle("lang-ar", state.lang==="ar");
  document.documentElement.lang = state.lang;
  document.documentElement.style.setProperty('--fs-scale', state.fontScale);
  render();
}

/* ---------------- PRECARGA (no bloqueante) ---------------- */
window.addEventListener('load', ()=>{
  [IMG_START, IMG_LOGO].forEach(url=>{ const img = new Image(); img.src = url; });
  Object.keys(SOUND_FILES).forEach(k=>{ try{ getSound(k); }catch(e){} });
});

/* ---------------- INIT ---------------- */
(function init(){
  render();
})();
</script>
